<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Source of og-image.png (1200x630), rendered once with the site's own fonts.
     Not linked from the page and not deployed. -->
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #008080; font-family: "PT Sans", sans-serif; display: grid; place-items: center; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
  .win { width: 1040px; background: #c0c0c0; border: 4px solid; border-color: #ffffff #404040 #404040 #ffffff; box-shadow: inset -4px -4px 0 #808080, inset 4px 4px 0 #dfdfdf; }
  .bar { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 20px; background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-family: "Pixelify Sans", monospace; font-size: 34px; font-weight: 700; }
  .bar img { width: 40px; height: 40px; image-rendering: pixelated; }
  .bar .x { margin-left: auto; width: 40px; height: 36px; background: #c0c0c0; color: #000; display: grid; place-items: center; font-size: 28px; border: 3px solid; border-color: #ffffff #404040 #404040 #ffffff; }
  .body { display: grid; grid-template-columns: 200px 1fr; gap: 44px; padding: 48px 56px 52px; align-items: center; }
  .icon { width: 200px; height: 200px; image-rendering: pixelated; }
  h1 { margin: 0; font-family: "Pixelify Sans", monospace; font-size: 96px; line-height: 1; color: #000080; }
  h1 span { color: #c0006a; }
  p { margin: 18px 0 0; font-size: 33px; line-height: 1.25; color: #111; }
  .url { margin-top: 26px; font-family: "PT Mono", monospace; font-size: 24px; color: #333; }
</style>
</head>
<body>
  <div class="win">
    <div class="bar"><img src="icons/snack.svg" alt=""><span>filian.ru</span><span class="x">×</span></div>
    <div class="body">
      <img class="icon" src="icons/snack.svg" alt="">
      <div>
        <h1>Snackers <span>RU</span></h1>
        <p>Русскоязычное фан-сообщество Филиан (Filian)</p>
        <div class="url">Discord · клипы с субтитрами · фан-арт · вики</div>
      </div>
    </div>
  </div>
</body>
</html>
