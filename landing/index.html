<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FilianWIKI: the Snackers remember everything</title>
<meta name="description" content="A fan wiki for Filian's community, the Snackers: lore, clips, emotes and running jokes on an open engine with no ads and no trackers. Closed alpha, anyone can ask to join. Not affiliated with Filian, not part of any ARG." />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0b0713" />
<meta name="robots" content="index, follow" />
<meta property="og:type" content="website" />
<meta property="og:title" content="FilianWIKI: the Snackers remember everything" />
<meta property="og:description" content="A fan wiki for the Snackers, in closed alpha. Anyone can ask to join. No ads, no trackers, not an ARG." />
<meta property="og:url" content="https://filian.wiki/" />
<meta property="og:image" content="https://filian.wiki/assets/art/landing-logo.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/assets/art/mark.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-96x96.png" sizes="96x96" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="canonical" href="https://filian.wiki/" />
<!-- Fonts, art and code all come from this server: no third party sees a visit. -->
<link rel="preload" href="/assets/fonts/unbounded-latin-3.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/assets/fonts/fonts.css" />
<script>
  /* Before first paint: the theme, and whether scripts run at all. */
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem("naw-theme");
      if (t === "light" || t === "dark") d.dataset.theme = t;
      else if (matchMedia("(prefers-color-scheme: light)").matches) d.dataset.theme = "light";
    } catch (e) {}
    d.classList.add("js");
  })();
</script>
</head>
<body>
<div id="app"><!--app-html--></div>
<noscript><style>.js-only { display: none !important; }</style></noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
