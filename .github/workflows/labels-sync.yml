name: Sync labels

# Keeps the repository label set identical to .github/labels.yml.
# That file is the single source of truth for names, colours and descriptions.

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels-sync.yml"
      - "scripts/sync-labels.ts"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync labels from labels.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Sync to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/sync-labels.ts --platform github

      - name: Sync to Forgejo
        if: ${{ vars.FORGEJO_URL != '' }}
        env:
          FORGEJO_URL: ${{ vars.FORGEJO_URL }}
          FORGEJO_REPO: ${{ vars.FORGEJO_REPO }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: bun run scripts/sync-labels.ts --platform forgejo --dry-run

# Nothing is pruned. Removing a label destroys history that we might want to
# read later, so deletions are done by hand on purpose.
#
# The Forgejo step runs with --dry-run on purpose: it changes nothing and only prints what
# would change, so a bad secret or a typo in the manifest cannot damage a remote repo.
# Drop --dry-run once you have reviewed a real run.
#
# The Forgejo step is skipped unless the repository defines vars.FORGEJO_URL,
# vars.FORGEJO_REPO and secrets.FORGEJO_TOKEN (write access to issues and labels).
