name: Sync labels

# Keeps the repository label set identical to .github/labels.yml.
# That file is the single source of truth for names, colours and descriptions.

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels-sync.yml"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync labels from labels.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync to GitHub
        uses: micnncim/action-label-syncer@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yml
          prune: false

      - name: Sync to Forgejo
        if: ${{ vars.FORGEJO_URL != '' }}
        env:
          FORGEJO_URL: ${{ vars.FORGEJO_URL }}
          FORGEJO_REPO: ${{ vars.FORGEJO_REPO }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          bun run scripts/sync-labels-forgejo.ts \
            --url "$FORGEJO_URL" \
            --repo "$FORGEJO_REPO" \
            --token "$FORGEJO_TOKEN" \
            --dry-run

# prune is deliberately false. Removing a label destroys history that we might want to
# read later, so deletions are done by hand on purpose.
#
# The Forgejo step runs with --dry-run on purpose: it changes nothing and only prints what
# would change, so a bad secret or a typo in the manifest cannot damage a remote repo.
# Drop --dry-run once you have reviewed a real run.
#
# Required settings, otherwise the Forgejo step is skipped and only GitHub is synced:
#   vars.FORGEJO_URL       https://git.vai-rice.space
#   vars.FORGEJO_REPO      VAI_PROG/NotAnOtherVTUBERwiki
#   secrets.FORGEJO_TOKEN  token with write access to issues and labels
