name: Artwork submission
description: Send us art. Yes, we would love to replace the AI generated images with yours.
title: "art: "
labels: ["art", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Several images in this repository are AI generated, and we would much
        rather ship art made by a person. See [AI-ASSETS.md](../blob/dev/AI-ASSETS.md) for
        the full terms. The summary is below, and the checkboxes at the end are the
        agreement.

        **One caution before you start drawing:** an existing VTuber's character design
        belongs to the talent and their agency, so a drawing of it is a derivative work.
        We love fan art, but we cannot distribute it, so please prefer original
        characters, mascots, abstracts, and typography over direct copies of official art.

  - type: input
    id: credit
    attributes:
      label: How should we credit you
      description: Name, handle, or "anonymous". We credit by default, but it is your call.
    validations:
      required: true

  - type: dropdown
    id: how-made
    attributes:
      label: How was this made
      options:
        - Entirely by a human, no AI assistance
        - By a human, with some AI assistance
        - Mostly generated by AI, then edited by a human
        - Entirely generated by AI
    validations:
      required: true

  - type: textarea
    id: ai-detail
    attributes:
      label: If AI was involved, how
      description: We will not reject your work for this. We just will not label it as human made.
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: What is it
      options:
        - Logo or mascot for the engine
        - Repository banner
        - Favicon or icon set
        - Skin or theme for FilianWIKI
        - Loading or error page illustration
        - Pixel art
        - ASCII art
        - Something else
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files
      description: |
        Attach the image here, or open a pull request adding it under .github/assets/ or
        assets/. If you have a source file (SVG, XCF, PSD, Aseprite), please include it,
        it makes future edits much easier.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Licence preference, colour notes, or where you would like it used.
    validations:
      required: false

  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement
      description: |
        By submitting you grant the project a perpetual, irrevocable, worldwide,
        non-exclusive, royalty-free, transferable and sublicensable licence to use,
        modify, distribute and display the work for any purpose, with or without
        attribution, and you waive moral rights to the extent the law allows. You keep
        ownership. Full wording in AI-ASSETS.md.
      options:
        - label: I created this work, or I hold the rights needed to licence it
          required: true
        - label: It does not infringe anyone else's copyright, trademark, or other rights
          required: true
        - label: I grant the project the perpetual, irrevocable licence described in AI-ASSETS.md
          required: true
        - label: I understand that because the licence is irrevocable, the art usually cannot be removed later
          required: true
        - label: I have stated accurately whether AI was used
          required: true
        - label: I want this dedicated to the public domain under CC0 instead (optional)
          required: false
