{#
  Snackers: the FilianWIKI skin. Every template comes from skins/default; this
  file is the whole difference. Deep plum surfaces, pink primary, violet
  secondary, dark by default because streams run late. Flat: the pink rule
  under the header and the left-ruled pullquote are the only decoration.
#}
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon-96x96.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0b0713" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#fdeef6" media="(prefers-color-scheme: light)" />
<script nonce="{{ csp_nonce() }}">
/* Dark unless the reader picked light. Runs in <head>, before first paint,
 * so there is no white flash on the way to plum. */
(function () {
  try {
    var saved = localStorage.getItem("naw-theme");
    if (saved !== "light" && saved !== "dark") document.documentElement.dataset.theme = "dark";
  } catch (e) {
    document.documentElement.dataset.theme = "dark";
  }
})();
</script>
<style>
:root {
  --bg: #fff6fb;
  --bg-elevated: #fdeef6;
  --surface: #ffffff;
  --surface-sunken: #f9e2ef;
  --ink: #2b1020;
  --ink-soft: #5c2b45;
  --muted: #7d5a70;
  --faint: #c4a8b8;
  --line: #f0d3e6;
  --border-strong: #d8a8c4;
  --accent: #c8005f;
  --accent-ink: #ffffff;
  --accent-soft: rgba(200, 0, 95, 0.09);
  --accent-2: #7a3fe0;
  --content-width: 44rem;
}
html[data-theme="dark"] {
  --bg: #0b0713;
  --bg-elevated: #150e22;
  --surface: #0b0713;
  --surface-sunken: #211732;
  --ink: #ffffff;
  --ink-soft: #e8d5e2;
  --muted: #a89fba;
  --faint: #5c4a68;
  --line: #2d1e45;
  --border-strong: #4a2d6b;
  --accent: #ff3d8b;
  --accent-ink: #1c0712;
  --accent-soft: rgba(255, 61, 139, 0.14);
  --accent-2: #a366ff;
}
@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --bg: #0b0713;
    --bg-elevated: #150e22;
    --surface: #0b0713;
    --surface-sunken: #211732;
    --ink: #ffffff;
    --ink-soft: #e8d5e2;
    --muted: #a89fba;
    --faint: #5c4a68;
    --line: #2d1e45;
    --border-strong: #4a2d6b;
    --accent: #ff3d8b;
    --accent-ink: #1c0712;
    --accent-soft: rgba(255, 61, 139, 0.14);
    --accent-2: #a366ff;
  }
}

/* The one piece of chrome that is ours: a solid pink rule under the header. */
.site-header { box-shadow: inset 0 -2px 0 var(--accent); }
.site-brand-mark { width: 1.5em; height: 1.5em; border-radius: 0.3em; background: url("/favicon-96x96.png") center / cover no-repeat; }
.site-brand:hover .site-brand-mark { transform: none; }

/* Pullquotes rule on the left, like a chat message quoted in the VOD notes. */
figure.pullquote { padding: 0 0 0 var(--s4); border-left: 3px solid var(--accent); text-align: left; }
figure.pullquote blockquote { display: block; padding: 0; margin: 0; font-size: 1.2rem; }
.toc { border-left-color: var(--accent-soft); }
.content blockquote.markdown-alert-important { border-color: var(--accent-2); }
.content blockquote.markdown-alert-caution { border-color: #ff3860; }
.footnotes { border-top-width: 2px; border-top-color: var(--border-strong); }

/* Marks in the plum palette. The default greys read as dirt on pink. */
.content mark.mark-red { background: #ffc9d6; color: #6b1430; }
.content mark.mark-pink { background: #ffc2e2; color: #70143f; }
.content mark.mark-violet { background: #e2d4ff; color: #421e78; }
.content mark.mark-gray { background: #e6d9e6; color: #4a2d4a; }
html[data-theme="dark"] .content mark.mark-red { background: #7c2440; color: #ffe3ec; }
html[data-theme="dark"] .content mark.mark-pink { background: #8a2a5c; color: #ffe6f3; }
html[data-theme="dark"] .content mark.mark-violet { background: #53308f; color: #ece4ff; }
html[data-theme="dark"] .content mark.mark-gray { background: #4a2d55; color: #f0e2f0; }
</style>
