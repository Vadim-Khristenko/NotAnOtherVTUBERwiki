<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="/"><img class="brand-mark" src="/favicon-96x96.png" alt="" width="24" height="24" />{{ wiki_name }}</a>
    <nav class="site-nav">
      <a class="nav-link" href="/about">About</a>
      <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme">◑</button>
    </nav>
  </div>
</header>
<script>
(function () {
  var btn = document.getElementById("theme-toggle");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var root = document.documentElement;
    var next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("naw-theme", next); } catch (e) {}
  });
})();
</script>
