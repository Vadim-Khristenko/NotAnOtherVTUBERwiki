{#
  The theme slot. The layout includes this file in <head>, after its own
  styles, so whatever a skin puts here wins over the defaults without a single
  !important.

  The default skin ships it empty. A skin that only recolors needs nothing
  else: copy this file into skins/<yours>/, add a <style> block that sets the
  :root variables, and every template falls back to the default ones. See
  skins/snackers/_theme.html for a complete example.
#}
