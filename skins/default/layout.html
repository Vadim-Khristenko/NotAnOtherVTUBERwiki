<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ title }} | {{ wiki_name }}</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; color: #1c1c1e; background: #fff; }
header { border-bottom: 1px solid #e5e5ea; padding: 0.8rem 1.2rem; font-weight: 700; }
header a { color: inherit; text-decoration: none; }
main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.2rem 3rem; line-height: 1.6; }
footer { border-top: 1px solid #e5e5ea; padding: 1rem 1.2rem; color: #8e8e93; font-size: 0.85rem; }
</style>
</head>
<body>
<header><a href="/">{{ wiki_name }}</a></header>
<main>{% block body %}{% endblock %}</main>
<footer>Powered by NotAnotherWiki</footer>
</body>
</html>
