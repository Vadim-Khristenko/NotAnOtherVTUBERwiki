# cargo-deny policy, checked in CI by the "Dependency advisories and licenses" job.
# Run it locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # Marvin attack on rsa: timing side channel in private key operations
  # (decryption and signing). rsa arrives through jsonwebtoken, which this
  # engine uses only to verify provider ID tokens against public keys, so the
  # vulnerable path never runs. No fixed release exists; revisit when one does.
  { id = "RUSTSEC-2023-0071", reason = "only public key verification is used" },
]

[licenses]
version = 2
# Our own crates are AGPL and unpublished, so they are not checked against the
# list below. Every dependency must be compatible with shipping under AGPL.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # File level copyleft, compatible with AGPL.
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are common during ecosystem upgrades (digest 0.10
# and 0.11 right now). Worth seeing, not worth a red build.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
