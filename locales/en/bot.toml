# English texts of the wiki's bots (Telegram and Discord).
#
# Keys are asked for as bot.<key>. A text is written in Telegram's rich
# HTML: <b>, <i>, <u>, <s>, <code>, <pre>, <a href>, <blockquote>,
# <tg-spoiler>, <h1>-<h3>, <br>. Discord gets it turned into Markdown.
# Everything put in with {name} is escaped for the platform, so a username
# cannot add formatting, a link or a mention. Premium emoji: {emoji:ID|👍}
# (the custom emoji on Telegram, the fallback elsewhere).

help = "<b>{wiki}</b>\nThis is the wiki's bot. It sends password reset links, sign-in alerts and, if you want, your notifications.\n\nTo link your account, open your settings on the wiki and press <b>Link</b>:\n{settings_url}\n\n/lang changes the bot's language."
