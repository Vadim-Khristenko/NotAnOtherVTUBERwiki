# English messages for the wiki's Telegram bot, and the Telegram card in the
# settings.
#
# Keys here are asked for as telegram.<key>. The file name is the prefix.
# Bot messages are Telegram HTML: <b>, <i>, <code> and <a> work, and every
# argument arrives escaped.

# The linking page
link_title = "Link Telegram"
