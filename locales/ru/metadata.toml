# Метаданные языкового пакета.
#
# Каталог в locales/ считается пакетом ровно тогда, когда в нём лежит этот
# файл. Остальные *.toml рядом хранят части интерфейса, и имя файла служит
# префиксом ключа: `search.toml` содержит то, что шаблоны запрашивают как
# `search.*`.
#
# Пакеты перечитываются без перезапуска: правка сообщения, новый язык или
# переключение `enabled` вступают в силу на следующем запросе после того, как
# их заметит наблюдатель, или сразу из Админки > Языки.

code = "ru"
name = "Russian"
native_name = "Русский"
version = "0.2.0"
engine = "0.1.0"
enabled = true
direction = "ltr"

[[authors]]
name = "VAI"
role = "maintainer"
url = "https://vai-rice.space"
