# Russian interface messages: errors.
#
# Keys here are asked for as errors.<key>. The file name is the prefix.

back_home = "На главную"
back_to_sign_in = "Ко входу"
retry = "Попробовать ещё раз"
status = "Ошибка {status}"
request_id = "Номер запроса: {id}"
request_id_hint = "Назовите его, если сообщаете о проблеме: по нему мы найдём точную строку в логах."
detail = "Что ответил сервер"

[not_found]
title = "По этому адресу ничего нет"
body = "Страницу могли переименовать или отправить в архив, а может, в ссылке опечатка."
hint = "Поиск обычно находит то, на что вела сломанная ссылка."

[forbidden]
title = "Дверь видно, но она заперта"
body = "Вы вошли в аккаунт, но у него нет прав на это действие здесь."
hint = "Если права должны быть, напишите модераторам этой вики."

[unauthorized]
title = "Сначала войдите"
body = "Эта часть вики доступна только вошедшим."

[conflict]
title = "Кто-то успел раньше"
body = "Пока вы вносили изменения, это же успел изменить кто-то другой, поэтому мы ничего не перезаписали."
hint = "Откройте заново, сравните и примените свою часть."

[invalid]
title = "Что-то не подошло"
body = "В форме или ссылке оказалось что-то, с чем мы не можем работать."
hint = "Ниже написано, что именно. Вернитесь, исправьте и отправьте снова."

[method_not_allowed]
title = "Адрес верный, запрос не тот"
body = "Такой адрес есть, но так он не отвечает. Обычно это значит, что вместо кнопки нажали ссылку."

[too_large]
title = "Многовато"
body = "Отправленное больше, чем эта вики принимает за раз."
hint = "Разбейте очень длинную страницу на несколько или отправьте файл поменьше."

[rate_limited]
title = "Помедленнее, снэкерс"
body = "За короткое время пришло очень много запросов, поэтому ваши ненадолго притормозили."
hint = "Подождите минуту и попробуйте снова."

[auth_failed]
title = "Войти не получилось"
body = "Сервис входа не подтвердил, кто вы, или ссылка для входа уже использована или устарела."
hint = "Начните заново со страницы входа: каждая попытка получает свежую ссылку."

[auth_disabled]
title = "Вход сейчас отключён"
body = "Команда вики временно приостановила вход. Читать можно как обычно."

[manual_login]
title = "Ещё один шаг до входа"
body = "Вы входите без JavaScript, поэтому понадобится небольшой ручной шаг. Следуйте инструкции на этой странице и уложитесь в несколько минут."

[maintenance]
title = "Скоро вернёмся"
body = "Над вики сейчас работают. Всё, что вы написали, в сохранности."
hint = "Загляните через несколько минут."

[unavailable]
title = "Одна из служб не отвечает"
body = "Вики работает, но один из сервисов за ней сейчас молчит. Обычно это ненадолго."

[internal]
title = "Это наша ошибка"
body = "При обработке запроса у нас что-то сломалось. Мы это записали."

[auth_failed.bad_request]
title = "Вход не начался"
body = "Ссылка для входа оказалась неправильной. Начните заново со страницы входа, и всё получится."

[auth_failed.cancelled]
title = "Вход отменён"
body = "Вы отменили вход, ничего не создано. Возвращайтесь, когда захотите."

[auth_failed.expired]
title = "Ссылка для входа устарела"
body = "Ссылка для входа живёт десять минут, и эта истекла. Начните заново, и вы получите новую."

[auth_failed.upstream]
title = "У сервиса входа неполадки"
body = "Сервис, через который вы входите, ответил неправильно. Подождите немного и попробуйте снова или выберите другой."

[auth_failed.closed]
title = "Здесь пока нет аккаунта"
body = "Вход прошёл, но вики сейчас только по приглашению, и этот вход не привязан ни к одному аккаунту. Ничего не создано."
action = "Как попросить аккаунт"
