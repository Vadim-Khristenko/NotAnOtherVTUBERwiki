# Русские тексты ботов вики (Telegram и Discord).
#
# Ключи запрашиваются как bot.<ключ>. Текст пишется в rich HTML Telegram:
# <b>, <i>, <u>, <s>, <code>, <pre>, <a href>, <blockquote>, <tg-spoiler>,
# <h1>-<h3>, <br>. Для Discord он сам переводится в Markdown. Всё, что
# подставляется через {имя}, экранируется для нужной платформы, так что ник
# не может добавить разметку, ссылку или упоминание. Премиум-эмодзи:
# {emoji:ID|👍} (в Telegram кастомный эмодзи, иначе запасной символ).

help = "<b>{wiki}</b>\nЭто бот вики. Он присылает ссылки для сброса пароля, предупреждения о входах и, если захотите, ваши уведомления.\n\nЧтобы привязать аккаунт, откройте настройки на вики и нажмите <b>Привязать</b>:\n{settings_url}\n\n/lang поменяет язык бота."
help_linked = "<b>{wiki}</b>\nЭтот чат привязан к аккаунту <b>{user}</b>.\n\n/reset пришлёт ссылку для нового пароля.\n/unlink отвяжет чат.\n/lang поменяет язык бота."
link_howto = "<b>{wiki}</b>\nПривязка начинается на вики, чтобы её мог сделать только владелец аккаунта. Откройте настройки, нажмите <b>Привязать</b>, затем отправьте мне <code>/link</code> с показанным там кодом:\n{settings_url}"
linked = "{emoji:5368324170671202286|👍} <b>{wiki}</b>\nГотово: чат привязан к аккаунту <b>{user}</b>. Если забудете пароль, отправьте сюда /reset или нажмите ссылку на странице входа."
linked_by_login = "<b>{wiki}</b>\nВы вошли через Telegram и разрешили боту писать вам, поэтому этот чат теперь привязан к аккаунту <b>{user}</b>. Сюда будут приходить ссылки для сброса пароля (/reset) и предупреждения о входах. /unlink отвяжет чат."
link_expired = "<b>{wiki}</b>\nКод устарел или уже использован. Откройте настройки на вики и снова нажмите <b>Привязать</b>."
already_linked = "<b>{wiki}</b>\nЭтот чат уже привязан к аккаунту <b>{user}</b> и останется с ним. Чтобы привязать его к другому аккаунту, сначала отправьте /unlink, затем возьмите новый код в настройках нужного аккаунта."
unlinked = "<b>{wiki}</b>\nЧат отвязан. Бот больше не будет сюда писать."
